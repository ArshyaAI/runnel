name: CI

on:
  push:
    branches: [main, feat/v0.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-arm64:
    name: macOS arm64 full gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - run: make help
      - run: make check-config
      - run: make fmt-check
      - run: make test
      - run: make test-race
      - run: make vet
      - run: make test-schema check-scripts
      - run: make security

  smoke-amd64:
    name: macOS amd64 native install smoke
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - run: make smoke TARGET=darwin/amd64
