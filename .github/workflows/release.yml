name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing tag, for example v0.1.0
        required: true
        type: string
      approve_release:
        description: Assemble attested release-candidate artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate explicit tagged authority
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release inputs and ref
        env:
          APPROVED: ${{ inputs.approve_release }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          [ "$APPROVED" = "true" ] || { echo "approve_release must be true"; exit 1; }
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          [ "$REF_TYPE" = "tag" ] || { echo "select the exact tag ref"; exit 1; }
          [ "$REF_NAME" = "$VERSION" ] || { echo "tag and version differ"; exit 1; }
          [ "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" ]

  gate-arm64:
    name: macOS arm64 release gate
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - run: make ci

  gate-amd64:
    name: macOS amd64 release gate
    needs: validate
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - run: make smoke TARGET=darwin/amd64

  build:
    name: Native ${{ matrix.arch }} archive
    needs: [gate-arm64, gate-amd64]
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true
      - name: Package reproducible native archive
        run: scripts/package-release.sh "darwin/${{ matrix.arch }}" "${{ inputs.version }}" dist
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/runnel_${{ inputs.version }}_darwin_${{ matrix.arch }}.tar.gz
          format: cyclonedx-json
          output-file: dist/sbom-${{ matrix.arch }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0
      - name: Attest artifacts on their native builder
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/runnel_${{ inputs.version }}_darwin_${{ matrix.arch }}.tar.gz
            dist/checksums-${{ matrix.arch }}.txt
            dist/sbom-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runnel-${{ matrix.arch }}-${{ inputs.version }}
          if-no-files-found: error
          path: |
            dist/runnel_${{ inputs.version }}_darwin_${{ matrix.arch }}.tar.gz
            dist/checksums-${{ matrix.arch }}.txt
            dist/sbom-${{ matrix.arch }}.cdx.json

  aggregate:
    name: Attested release-candidate bundle
    needs: build
    runs-on: macos-15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runnel-*-${{ inputs.version }}
          merge-multiple: true
          path: dist
      - name: Verify and aggregate checksums
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            [ -f "dist/checksums-${arch}.txt" ]
          done
          cat dist/checksums-arm64.txt dist/checksums-amd64.txt | LC_ALL=C sort > dist/checksums.txt
          (cd dist && shasum -a 256 -c checksums.txt)
      - name: Generate non-publishing Homebrew formula
        run: scripts/build-homebrew-formula.sh darwin "${{ inputs.version }}" dist
      - name: Write candidate notes
        run: |
          printf '%s\n\n%s\n' \
            "# Runnel ${{ inputs.version }} release candidate" \
            "Native arm64/amd64 archives, SHA-256 checksums, CycloneDX SBOMs, provenance attestations, and formula template." \
            > dist/release-candidate-notes.md
      - name: Attest aggregate metadata
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/runnel.rb
            dist/release-candidate-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runnel-release-candidate-${{ inputs.version }}
          if-no-files-found: error
          path: |
            dist/runnel_${{ inputs.version }}_darwin_arm64.tar.gz
            dist/runnel_${{ inputs.version }}_darwin_amd64.tar.gz
            dist/checksums.txt
            dist/sbom-arm64.cdx.json
            dist/sbom-amd64.cdx.json
            dist/runnel.rb
            dist/release-candidate-notes.md
